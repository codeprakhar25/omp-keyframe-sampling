<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tag-swap A/B — Orpheus LoRA</title>
<style>
  :root {
    --bg: #f6f1e8; --ink: #1c1916; --muted: #5c5348; --line: #d9cfc0;
    --card: #fffdf8; --accent: #0f6b5c;
  }
  body {
    margin: 0; font: 14px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
    color: var(--ink);
    background: radial-gradient(900px 400px at 10% -10%, #e7f2ef 0%, transparent 55%), var(--bg);
  }
  main { max-width: 820px; margin: 0 auto; padding: 22px 14px 80px; }
  h1 { font-size: 1.25rem; }
  .sub { color: var(--muted); max-width: 70ch; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin: 12px 0;
  }
  audio { width: 100%; margin: 6px 0; }
  button {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    padding: 8px 12px; cursor: pointer; font: inherit; margin-right: 6px;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ask { font-weight: 650; margin: 8px 0; }
  .status { color: var(--muted); font-size: 0.9rem; }
  .status.ok { color: var(--accent); }
  label.notes-label {
    display: block; margin-top: 10px; font-size: 0.8rem; color: var(--muted);
  }
  textarea.notes {
    width: 100%; min-height: 56px; margin-top: 4px; resize: vertical;
    font: inherit; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; background: #fff; box-sizing: border-box;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Tag-swap A/B — Orpheus LoRA</h1>
  <p class="sub">
    Blind listen: which clip better matches the asked tag?
    Wavs: <code>eval_pairs_orpheus/</code>. Saves to <code>eval_orpheus.json</code>
    (separate from Mio). Compare: <a href="base-vs-lora-orpheus.html">base vs LoRA</a>.
  </p>
  <div class="status" id="status">Loading…</div>
  <div id="panel"></div>
  <button type="button" class="primary" id="saveBtn">Save judgments</button>
</main>
<script>
let doc = null;
const statusEl = document.getElementById("status");
const panel = document.getElementById("panel");

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function updateStatus() {
  const n = (doc.pairs || []).filter(p => p.pick).length;
  statusEl.textContent = `Judged ${n}/${(doc.pairs || []).length}`;
  statusEl.className = "status ok";
}

function render() {
  panel.innerHTML = "";
  (doc.pairs || []).forEach((p) => {
    if (p.notes == null) p.notes = "";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<div><b>${p.id}</b> · ${p.family}</div>
      <div class="ask">Which clip is more <code>${p.tag_a}</code>?</div>
      <div>Text: ${p.text}</div>`;
    const a = document.createElement("audio");
    a.controls = true; a.preload = "none";
    a.src = "scale/" + p.wav_a;
    const b = document.createElement("audio");
    b.controls = true; b.preload = "none";
    b.src = "scale/" + p.wav_b;
    const la = document.createElement("div"); la.textContent = "Clip A";
    const lb = document.createElement("div"); lb.textContent = "Clip B";
    div.append(la, a, lb, b);
    const row = document.createElement("div");
    row.style.marginTop = "8px";
    const btns = [];
    for (const [val, label] of [["a","A more"],["b","B more"],["same","Same"],["unsure","Unsure"]]) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      if (p.pick === val) btn.classList.add("primary");
      btn.onclick = () => {
        p.pick = val;
        p.correct = val === "a";
        btns.forEach(b => b.classList.toggle("primary", b === btn));
        updateStatus();
      };
      btns.push(btn);
      row.appendChild(btn);
    }
    div.appendChild(row);

    const lab = document.createElement("label");
    lab.className = "notes-label";
    lab.textContent = "Notes";
    const ta = document.createElement("textarea");
    ta.className = "notes";
    ta.placeholder = "what you heard / quality / tag mismatch…";
    ta.value = p.notes || "";
    ta.oninput = () => { p.notes = ta.value; };
    div.append(lab, ta);

    panel.appendChild(div);
  });
  updateStatus();
}

async function load() {
  doc = await api("/api/scale/eval_orpheus");
  render();
}

async function save() {
  const res = await api("/api/scale/eval_orpheus", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(doc),
  });
  statusEl.textContent = "Saved " + res.path;
  statusEl.className = "status ok";
}

document.getElementById("saveBtn").onclick = save;
load().catch(e => { statusEl.textContent = String(e); statusEl.className = "status"; });
</script>
</body>
</html>
